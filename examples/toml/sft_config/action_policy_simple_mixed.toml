# Multitask (14-task equal-weight blend) run config for the
# `action_policy_simple_mixed_nano` experiment. Same run-level scalars as the
# single-task action_policy_simple.toml (so the 10k point is comparable), only the
# experiment + wandb differ. Dataset roots live in the experiment (14 per-task
# _v30_20ep streams), so nothing dataset-related here.
#
# Env: PSI_HOME=/path/to/psi_home, BASE_CHECKPOINT_PATH=<Cosmos3-Nano DCP>, WAN_VAE_PATH=<Wan2.2_VAE.pth>,
#      IMAGINAIRE_OUTPUT_ROOT=<output root>

[job]
task         = "vfm"
experiment   = "action_policy_simple_mixed_nano"
project      = "psi"
group        = "cosmos3_action_sft"
name         = "${oc.env:RESUME_RUN_NAME,action_policy_simple_mixed_${now:%y%m%d%H%M}}"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [40000]   # same LR-schedule shape as single-task; stop at 10k via max_iter override

[trainer]
max_iter     = 40000
logging_iter = 100

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 1000

[dataloader_train]
max_samples_per_batch = 16
