# Multitask (14-task equal-weight blend) run config, 50 TRAIN eps/task, for the
# `action_policy_simple_mixed50_nano` experiment. Same run-level scalars as the 20-ep
# multitask run (action_policy_simple_mixed.toml) so 20-ep vs 50-ep is controlled — only
# the per-task training-set size differs (18 -> 50; val unchanged). Dataset roots live in
# the experiment (14 per-task _v30_50tr streams), so nothing dataset-related here.
#
# Env: PSI_HOME=/path/to/data, BASE_CHECKPOINT_PATH=<Cosmos3-Nano DCP>, WAN_VAE_PATH=<Wan2.2_VAE.pth>,
#      IMAGINAIRE_OUTPUT_ROOT=<output root>

[job]
task         = "vfm"
experiment   = "action_policy_simple_mixed50_nano"
project      = "psi"
group        = "cosmos3_action_sft"
name         = "${oc.env:RESUME_RUN_NAME,action_policy_simple_mixed50_${now:%y%m%d%H%M}}"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[scheduler]
cycle_lengths = [40000]   # LR anneals to ~0 at 40k => loss curve converges

[trainer]
max_iter     = 40000
logging_iter = 100

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 10000         # 4 milestone ckpts (10/20/30/40k); disk-friendly at ~137 GB each

[dataloader_train]
max_samples_per_batch = 16
